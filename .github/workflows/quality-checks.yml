name: Quality checks

on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - "main"
      - "develop"
      - "stage"

jobs:
  lint-and-test:
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@b31a412a635636c20e9e026bd85e345880a5c3a5 # OPS-182 consumer compatibility fix
    secrets: inherit
