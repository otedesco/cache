name: Quality checks

on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - "main"
      - "develop"
      - "stage"

jobs:
  lint-and-test:
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@0a9c7f317a2e922aed37b526918fa16d51b8041e # OPS-182 consumer compatibility fix
    secrets: inherit
