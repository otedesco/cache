name: Quality checks

on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - "main"
      - "develop"
      - "stage"

permissions:
  contents: read

jobs:
  lint-and-test:
    permissions:
      contents: read
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@1ff2338701930c90d43887953e2827bef2f7bbc0 # OPS-186 package-authenticated central workflow

  quality-gate:
    name: Quality / core
    if: ${{ always() }}
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require quality workflow
        env:
          QUALITY_RESULT: ${{ needs.lint-and-test.result }}
        run: test "$QUALITY_RESULT" = success

  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@1ff2338701930c90d43887953e2827bef2f7bbc0 # OPS-186 package-authenticated central workflow
